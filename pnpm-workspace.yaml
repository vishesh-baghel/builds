packages:
  # Every build is a top-level directory with its own package.json, alongside `shared`.
  # pnpm skips directories that have none, so new builds need no edit here.
  - "*"

# vitest ships a native esbuild binary; without this pnpm skips its postinstall and the
# runner cannot start. Named explicitly rather than allowing every package to run scripts.
onlyBuiltDependencies:
  - esbuild
